# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # Color parsing changes wait on the owner's ruling.
      - dependency-name: "csscolorparser"
        versions: [">= 0.9"]
      # sqlite-cache requires rusqlite 0.32. Track its replacement in issue #13.
      - dependency-name: "rusqlite"
        versions: [">= 0.33"]
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories: ["/", "/addon"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
