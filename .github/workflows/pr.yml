name: PR

on:
  pull_request:
    branches:
      - main

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      with:
        toolchain: 1.100.0
        components: rustfmt, clippy
    - name: Build
      run: |
        cargo build --all
        git diff --exit-code -- Cargo.lock
    - name: Run tests
      run: cargo test --all -- --show-output
    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Check Clippy
      run: cargo clippy --all-targets

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
      - uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cargo-audit
          version: "0.23.0"
      - run: cargo audit
