name: Container Build

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "20*"
    branches:
      - main
    paths:
      - "**/*.rs"
      - "addon/**"
      - "**/Cargo.*"
      - ".github/workflows/build.yml"
      - ".cargo/config.toml"
      - "scripts/build-cross.sh"
      - "scripts/build-docker.sh"
      - "Dockerfile"
      - ".dockerignore"

permissions: {}

env:
  IMAGE: ghcr.io/mnbf9rca/govee2mqtt

jobs:
  build:
    name: build (linux/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68
      - &setup-buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.1
          driver-opts: image=moby/buildkit:v0.35.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install cross from Cargo
        uses: baptiste0928/cargo-install@8195d4f734a149db85385bb4102b42efcd373759 # v3.5.0
        with:
          crate: cross
          version: "0.2.5"
      - name: Build executable
        run: ./scripts/build-cross.sh linux/${{ matrix.arch }}
      - name: Test bridge image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
      - name: Upload executable for publishing
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.arch }}
          path: docker-target/linux/${{ matrix.arch }}/govee
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - *checkout
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*64'
          path: docker-target/linux
      - name: Restore executable permissions after artifact download
        run: chmod +x docker-target/linux/{amd64,arm64}/govee
      - *setup-buildx
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with: &registry-credentials
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
      - name: Publish bridge image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true

  build-addon:
    if: github.ref_type != 'tag'
    needs: build
    strategy: &addon-matrix
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps: &addon-steps
      - *checkout
      - name: Log in to read the bridge image
        if: github.ref_type != 'tag'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with: *registry-credentials
      - name: Resolve the base image and app metadata
        id: app
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          base="ghcr.io/home-assistant/$ARCH-base-debian:bookworm"
          digest=$(docker buildx imagetools inspect "$base" --format '{{.Manifest.Digest}}')
          echo "base=${base%:*}@$digest" >> "$GITHUB_OUTPUT"
          version=$(yq -er '.version' addon/config.yaml)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version=$GITHUB_REF_NAME; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          yq -er 'to_entries | .[] | select(.key == "name" or .key == "description" or .key == "url") | .key + "=" + .value' addon/config.yaml >> "$GITHUB_OUTPUT"
      - name: Install Cosign for the test build
        if: github.ref_type != 'tag'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # build-image verifies the base itself only when publishing.
      - name: Verify the Home Assistant base for the test build
        if: github.ref_type != 'tag'
        uses: home-assistant/builder/actions/cosign-verify@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          image: ${{ steps.app.outputs.base }}
          cosign-identity: &base-identity '^https://github\.com/home-assistant/docker-base/\.github/workflows/[^@]+@refs/tags/.+$'
      - name: Build Home Assistant app
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: addon
          image: ${{ env.IMAGE }}-${{ matrix.arch }}
          image-tags: |
            ${{ steps.app.outputs.version }}
            latest
          version: ${{ steps.app.outputs.version }}
          labels: |
            io.hass.name=${{ steps.app.outputs.name }}
            io.hass.description=${{ steps.app.outputs.description }}
            io.hass.url=${{ steps.app.outputs.url }}
          build-args: BUILD_FROM=${{ steps.app.outputs.base }}
          cosign-base-verify: ${{ steps.app.outputs.base }}
          cosign-base-identity: *base-identity
          container-registry-password: ${{ github.token }}
          push: ${{ github.ref_type == 'tag' }}

  # Keep the single required check for both native builds.
  test-addon:
    if: always() && github.ref_type != 'tag'
    needs: build-addon
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: test "${{ needs.build-addon.result }}" = success

  addon:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: publish
    strategy: *addon-matrix
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps: *addon-steps
